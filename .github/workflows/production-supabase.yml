name: Migrate production Supabase

# Nur manuell startbar. Es gibt bewusst keinen push-Trigger: eine Migration der
# Produktivdatenbank soll nie als Nebenwirkung eines Commits passieren.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Zuerst PREVIEW ausfuehren, danach APPLY mit der angezeigten Anzahl'
        type: choice
        options:
          - PREVIEW
          - APPLY
        required: true
        default: PREVIEW
      confirm:
        description: 'Nur fuer APPLY exakt MIGRATE eintippen'
        required: false
        default: ''
      expected_pending_count:
        description: 'Nur fuer APPLY: Pending migrations aus dem PREVIEW-Lauf'
        required: false
        default: ''
      backup_done:
        description: 'Nur fuer APPLY: Backup der Produktivdatenbank wurde erstellt'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: supabase-production-migration
  cancel-in-progress: false

jobs:
  migrate-production:
    name: Test and migrate production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - name: Require an explicit confirmation
        shell: bash
        run: |
          if [ "${{ inputs.mode }}" = "APPLY" ]; then
            if [ "${{ inputs.confirm }}" != "MIGRATE" ]; then
              echo "::error::Bestaetigung fehlt. Gib MIGRATE ein, um die Produktivdatenbank zu migrieren."
              exit 1
            fi
            if [ "${{ inputs.backup_done }}" != "true" ]; then
              echo "::error::Ohne bestaetigtes Backup wird nicht migriert."
              exit 1
            fi
            if ! [[ "${{ inputs.expected_pending_count }}" =~ ^[0-9]+$ ]]; then
              echo "::error::Fuer APPLY muss die Anzahl aus dem PREVIEW-Lauf eingetragen werden."
              exit 1
            fi
          fi

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Enable pnpm
        run: corepack enable

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint and test
        run: |
          pnpm lint
          pnpm test

      - name: Require every production secret
        shell: bash
        run: |
          if [ -z "$SUPABASE_PROJECT_ID" ] || [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN und SUPABASE_PROJECT_ID werden im Environment production benoetigt."
            exit 1
          fi

      - name: Preview pending migrations
        id: migration-preview
        run: node scripts/supabase-management-migrations.mjs --mode=preview

      - name: Apply migrations to production
        if: ${{ inputs.mode == 'APPLY' }}
        run: node scripts/supabase-management-migrations.mjs --mode=apply --expected-pending=${{ inputs.expected_pending_count }}
