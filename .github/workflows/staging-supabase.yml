name: Verify Supabase staging migration

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-staging-migration
  cancel-in-progress: false

jobs:
  migrate-staging:
    name: Test and migrate staging only
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: staging
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Enable pnpm
        run: corepack enable

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint and test
        run: |
          pnpm lint
          pnpm test

      - name: Refuse the production project
        shell: bash
        run: |
          if [ -z "$SUPABASE_PROJECT_ID" ] || [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD and SUPABASE_PROJECT_ID are required in the staging environment."
            exit 1
          fi
          if [ "$SUPABASE_PROJECT_ID" = "dlcsraxnofbtquhpnleu" ] || [ "$SUPABASE_PROJECT_ID" = "laduzigqgvvnrqcgfgab" ]; then
            echo "::error::Production project refused. Configure a separate staging Supabase project."
            exit 1
          fi

      - name: Link staging project
        run: pnpm dlx supabase@latest link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"

      - name: Preview pending migrations
        run: pnpm dlx supabase@latest db push --dry-run --password "$SUPABASE_DB_PASSWORD"

      - name: Apply migrations to staging
        run: pnpm dlx supabase@latest db push --password "$SUPABASE_DB_PASSWORD"
