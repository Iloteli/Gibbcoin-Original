[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gibbcoin"
version = "1.0.0"
description = "GibbCoin (GIBB) - eine schlanke, CPU-minebare Blockchain ohne Abhaengigkeiten"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["blockchain", "cryptocurrency", "proof-of-work", "mining", "gibbcoin"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Security :: Cryptography",
]
dependencies = []

[project.scripts]
gibbcoin = "gibbcoin.cli:main"

[tool.setuptools]
packages = ["gibbcoin"]
